<svg viewBox="0 0 100 100" preserveAspectRatio="none" >
    <line 
        [attr.x1]="data.x1"
        [attr.x2]="data.x2"
        [attr.y1]="data.y1"
        [attr.y2]="data.y2"
        [attr.strokeStyle]="toEnumStyle(data.line.style)"
        [attr.stroke]="data.line.color"
        strokeWidth="1"/>
</svg>
