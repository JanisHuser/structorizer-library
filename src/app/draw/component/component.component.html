<div
class="drawing">
    <app-draw-rectangle
        *ngFor="let rect of rectangles"
        (childClickedEvent)="childRectClicked($event)"
        [data]="rect"
        class="shape">
    </app-draw-rectangle>

    <app-text
        *ngFor="let text of texts"
        [component]="component"
        [data]="text"
        class="text">
        </app-text>
</div>
