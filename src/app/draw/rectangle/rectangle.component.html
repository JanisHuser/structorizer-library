<div 
    [style.marginLeft]="rectangle.left"
    [style.marginTop]="rectangle.top"
    [style.width]="'calc(100% - ' + rectangle.left + ' - ' +rectangle.right + ')'"
    [style.height]="'calc(100% - ' + rectangle.top + ' - ' +rectangle.bottom + ')'"
    [style.minHeight]="'calc(' + rectangle.top + 'px + ' + rectangle.bottom + 'px)'"
    [ngStyle]="{
        'background-color': rectangle.color != undefined ? rectangle.color : '#ffffff',
        'border-color': (rectangle.border != undefined && rectangle.border.color != undefined) ? rectangle.border.color : 'transparent',
        'border-width': rectangle.border != undefined ? rectangle.border.width : '1px',
        'border-style': rectangle.border != undefined ? toEnumStyle(rectangle.border.style) : 'none'
    }"
    class="rectangle"
>
    <app-draw-child
        [data]="data"
        *ngIf="rectangle.acceptsChildren">
    </app-draw-child>
</div>
