<div 
    [style.marginLeft]="data.left"
    [style.marginTop]="data.top"
    [style.width]="'calc(100% - ' + data.left + ' - ' +data.right + ')'"
    [style.height]="'calc(100% - ' + data.top + ' - ' +data.bottom + ')'"
    [ngStyle]="{
        'background-color': data.color != undefined ? data.color : '#ffffff',
        'border-color': (data.border != undefined && data.border.color != undefined) ? data.border.color : 'transparent',
        'border-width': data.border != undefined ? data.border.width : '1px',
        'border-style': data.border != undefined ? toEnumStyle(data.border.style) : 'none'
    }"
    class="rectangle"
    >
    <div class="child-container" *ngIf="data.acceptsChildren" (click)="childClicked($event)"></div>
</div>
