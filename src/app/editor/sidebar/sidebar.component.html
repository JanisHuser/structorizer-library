<div class="sidebar">
    <p class="title">Components</p>
    <div *ngFor="let component of (components.getComponents() | async)"
        class="component"
        (click)="playground.setActiveComponentIdentifier(component.identifier)">
        <p class="component-title">{{ language.get(component.title)}}</p>
        <div
            class="drawing"
            [style.height]="'100px'">
            <app-draw-parser
                [structure]="createEmptyStructure(component)"
                [style.height]="'100px'"
                [style.width]="'70%'"
        ></app-draw-parser>
        </div>
        
    </div>
</div>
