<div class="playfield">
    <div class="tabs">
        <div class="tab"
            *ngFor="let tab of tabs">
            <app-tab
                [data]="tab"
                (remove)="removeTab($event)"
                (enable)="enableTab($event)"
            ></app-tab>
        </div>
    </div>
    <div class="page">
        <div class="component"
            *ngFor="let component of activeTab.components">
        <app-draw-component
            [component]="component"
            [style.width]="'300px'"
            [style.height]="'300px'"></app-draw-component>
        </div>
        
    </div>
</div>
