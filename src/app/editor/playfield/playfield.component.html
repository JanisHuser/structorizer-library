<div class="playfield">
    <div class="tabs">
        <div class="tab"
            *ngFor="let tab of tabs">
            <app-tab
                [data]="tab"
                (remove)="removeTab($event)"
                (enable)="enableTab($event)"
            ></app-tab>
        </div>
    </div>
    <div class="page">
        <div class="component"
            *ngFor="let component of activeTab.components">
        <app-draw-component
            [component]="component"
            [style.minWidth]="'300px'"
            [style.minHeight]="'300px'"></app-draw-component>
        </div>
        
    </div>


    <app-draw-parser
    [component]="components">

    </app-draw-parser>
