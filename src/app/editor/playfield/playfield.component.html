<div class="playfield">
    <div class="tabs">
        <div class="tab"
            *ngFor="let page of (document.getDocument() | async)!.pages">
            <app-tab
                [data]="page"
                [isActive]="(document.getActivePage()) == page"
                (remove)="removePage($event)"
                (enable)="enablePage($event)"
            ></app-tab>
        </div>
        <a class="add-page"
        (click)="addNewPage()">
            +
        </a>
    </div>
    <div class="page">

        <app-draw-parser
        class="draggable-component"
            [structure]="document.getActivePage()!.structure"
            *ngIf="activeStructure.identifier != ''"
            [style.left]="(playground.getPosition() | async)!.x + 'px'"
            [style.top]="(playground.getPosition() | async)!.y + 'px'"
            [style.width]="previewElementSize.x + 'px'"
            [style.height]="previewElementSize.y + 'px'"
            ></app-draw-parser>
        

        <app-draw-parser
        class="draggable-component"
            [structure]="activeStructure"
            *ngIf="activeStructure.identifier != ''"
            [style.left]="(playground.getPosition() | async)!.x + 'px'"
            [style.top]="(playground.getPosition() | async)!.y + 'px'"
            [style.width]="previewElementSize.x + 'px'"
            [style.height]="previewElementSize.y + 'px'"
            ></app-draw-parser>
    </div>
</div>
