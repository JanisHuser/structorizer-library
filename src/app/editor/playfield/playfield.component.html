<div class="playfield">
    <div class="tabs">
        <div class="tab"
            *ngFor="let tab of tabs">
            <app-tab
                [data]="tab"
                (remove)="removeTab($event)"
                (enable)="enableTab($event)"
            ></app-tab>
        </div>
    </div>
    <div class="page">
        <div class="components"
        *ngIf="activeTab.components.length > 0">
        <div class="component"
            *ngFor="let component of activeTab.components">
            <app-draw-component
                [component]="component"
                [style.width]="'300px'"
                [style.height]="'300px'"></app-draw-component>
            </div>
        </div>
        

        <div class="component component-placeholder"
            *ngIf="activeTab.components.length == 0" 
            (mousedown)="placeholderClicked()"
            (touchstart)="placeholderClicked()"
        ></div>
    
        <app-draw-component #activeComponent
            *ngIf="this.hasActiveComponent == true"
            [component]="activeComponentValue"
            [style.position]="'absolute'"
            [style.left]="activeComponentLeft"
            [style.top]="activeComponentTop"
            [style.width]="'100px'"
            [style.height]="'100px'"></app-draw-component>
    </div>
</div>
