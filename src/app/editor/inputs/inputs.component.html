<div
class="config"
*ngFor="let config of inputs">
    <div class="header">{{config.header["de"]}}</div>

    <div *ngFor="let input of config.inputs" class="property">
        <div class="key">{{input.description}}</div>
        <app-text-input
            *ngIf="isText(input)"
            [input]="input"
            [configuration]="config"
        ></app-text-input>

        <app-dropdown
            *ngIf="isDropdown(input)"
            [input]="input"
            [configuration]="config"
        ></app-dropdown>
    </div>
</div>
