<table>

    <tr>
        <th>Name</th>
        <th>Value</th>
    </tr>

    <tr *ngFor="let input of component?.inputs">
        <td>{{ input.description }}</td>
        <td>
            <app-text-input
            *ngIf="isText(input)"
            [input]="input"
        ></app-text-input>

        <app-dropdown
            *ngIf="isDropdown(input)"
            [input]="input"
        ></app-dropdown>
        </td>
    </tr>
</table>
